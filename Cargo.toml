[workspace]
members = ["crates/browser-core", "crates/browser-ui", "crates/browser-search", "crates/browser-archive", "crates/browser-operations", "crates/browser-transfer", "crates/browser-native"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
browser-core = { path = "crates/browser-core" }
browser-ui = { path = "crates/browser-ui" }
browser-search = { path = "crates/browser-search" }
browser-archive = { path = "crates/browser-archive" }
browser-operations = { path = "crates/browser-operations" }
browser-transfer = { path = "crates/browser-transfer" }
browser-native = { path = "crates/browser-native" }
mui = { git = "https://github.com/Matari-Audio/MUI", rev = "f08ac4737c5a24f9c73ecda4cb68d2aeb7fb1a0a", features = ["cpu"] }
mui-winit = { git = "https://github.com/Matari-Audio/MUI", rev = "f08ac4737c5a24f9c73ecda4cb68d2aeb7fb1a0a" }
epaint_default_fonts = "0.36"
png = "0.18"

[package]
name = "megaman"
license.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:mui-winit"]

[dependencies]
browser-ui.workspace = true
mui.workspace = true
mui-winit = { workspace = true, optional = true }
png.workspace = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.perf]
inherits = "release"
opt-level = 3
strip = "none"
debug = 1
