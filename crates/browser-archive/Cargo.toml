[package]
name = "browser-archive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
crc32fast = "1.5"
sha2 = "0.10.9"
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
