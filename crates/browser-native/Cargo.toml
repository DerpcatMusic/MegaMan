[package]
name = "browser-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Native qualification requires Xvfb and Python-Xlib; enable explicitly.
native-x11-tests = []

[dependencies]
browser-transfer = { path = "../browser-transfer" }
browser-operations = { path = "../browser-operations" }
x11rb = { version = "=0.13.2", features = ["xfixes"] }
